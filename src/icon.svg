<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Browser window -->
  <rect x="6" y="14" width="88" height="72" rx="6" ry="6" fill="none" stroke="currentColor" stroke-width="5"/>
  <!-- Title bar -->
  <line x1="6" y1="30" x2="94" y2="30" stroke="currentColor" stroke-width="5"/>
  <!-- Title bar dots -->
  <circle cx="18" cy="22" r="3" fill="currentColor"/>
  <circle cx="30" cy="22" r="3" fill="currentColor"/>
  <circle cx="42" cy="22" r="3" fill="currentColor"/>
  <!-- Popup box -->
  <rect x="22" y="40" width="56" height="38" rx="4" ry="4" fill="none" stroke="currentColor" stroke-width="4"/>
  <!-- Form line -->
  <line x1="30" y1="52" x2="70" y2="52" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Button -->
  <rect x="36" y="60" width="28" height="10" rx="3" ry="3" fill="currentColor"/>
</svg>
